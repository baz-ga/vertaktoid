# .github/release.yml

changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: Breaking Changes 🛠
      labels:
        - semver-major
        - breaking-change
    - title: Enhancements 🎉
      labels:
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bugfix
    - title: Maintenance 🔧
      labels:
        - maintenance
    - title: Other Changes
      labels:
        - "*"
